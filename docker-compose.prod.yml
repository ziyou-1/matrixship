services:
  matrix-central:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: matrix-ship-central:${IMAGE_TAG:-prod-local}
    env_file:
      - ./backend/.env.prod
    environment:
      CENTRAL_HOST: 0.0.0.0
      CENTRAL_PORT: ${CENTRAL_PORT:-9080}
      CENTRAL_DATA_DIR: /app/central_data
      MATRIX_XHS_ENABLED: ${MATRIX_XHS_ENABLED:-0}
      MATRIX_VIDEO_REPLACEMENT_ENABLED: ${MATRIX_VIDEO_REPLACEMENT_ENABLED:-0}
      MATRIX_PENDING_PUBLISH_UI_ENABLED: ${MATRIX_PENDING_PUBLISH_UI_ENABLED:-0}
      MATRIX_DIGITAL_HUMAN_TTS_UPLOAD_ENABLED: ${MATRIX_DIGITAL_HUMAN_TTS_UPLOAD_ENABLED:-0}
      PYTHONUNBUFFERED: "1"
      NODE_ENV: production
    ports:
      - "${CENTRAL_PORT:-9080}:${CENTRAL_PORT:-9080}"
    volumes:
      - matrix-central-data:/app/central_data
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, urllib.request; port=os.getenv('CENTRAL_PORT','9080'); urllib.request.urlopen('http://127.0.0.1:%s/api/health' % port, timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  matrix-central-data:
