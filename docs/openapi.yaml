openapi: 3.1.0
info:
  title: MatrixShip Local Client and Central API
  version: 1.1.16
  description: Authentication, versioned legal consent, authenticated media download, health checks, and LK888 proxy contracts.
servers:
  - url: http://127.0.0.1:9081
    description: Local execution engine
  - url: http://127.0.0.1:9080
    description: Central server
paths:
  /api/auth/login:
    post:
      summary: Log in with username or phone credentials and accept current legal documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login succeeded and legal consent was audited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSuccess"}
        "400":
          description: Phone verification code is invalid or expired
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401":
          description: Credentials are invalid or phone verification is required
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "428":
          description: Legal consent is missing or does not match the current versions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegalConsentError"}
  /api/auth/register:
    post:
      summary: Register a phone account and accept current legal documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: Registration succeeded and legal consent was audited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSuccess"}
        "400":
          description: Input or verification code is invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "409":
          description: Phone account already exists
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "428":
          description: Legal consent is missing or does not match the current versions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegalConsentError"}
  /api/auth/refresh:
    post:
      summary: Refresh an authenticated session after checking current legal consent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSuccess"}
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "428":
          description: The account must accept current legal document versions again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegalConsentError"}
  /api/auth/change-password:
    post:
      summary: Change the current authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordRequest"
      responses:
        "200":
          description: Password changed for the current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthChangePasswordResponse"}
        "400":
          description: Current password is missing or the new password is too short
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "403":
          description: Current password is invalid or the login type cannot change passwords
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /api/health:
    get:
      summary: Service health
      responses:
        "200":
          description: Health payload from the selected server
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
                  mode: {type: string}
                  version: {type: string}
                  agentReady: {type: boolean}
                  authorized: {type: boolean}
                  cookieReady: {type: boolean}
                onlineNodes: {type: integer, minimum: 0}
              additionalProperties: true
  /api/v1/minimax/video/generate:
    post:
      summary: Submit an authenticated MiniMax direct video task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMaxVideoGenerateRequest"
      responses:
        "202":
          description: MiniMax provider task accepted and recorded as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMaxVideoTaskResponse"
        "400":
          description: Request validation failed before provider submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Center session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: MiniMax active-task concurrency limit is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MiniMax is disabled or the center key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: MiniMax provider submission failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/minimax/video/tasks/{task_id}:
    get:
      summary: Return an authenticated MiniMax direct video task status
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pending, failed, or awaiting-actual-cost task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMaxVideoTaskResponse"
        "401":
          description: Center session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task is missing or outside the authenticated user's scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/comic-drama/storyboards/{storyboard_id}/generate-image:
    post:
      summary: Generate storyboard image frames, optionally selecting one keyframe
      parameters:
        - name: storyboard_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComicStoryboardImageGenerateRequest"
      responses:
        "200":
          description: One or more image generation tasks were accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicStoryboardImageGenerateResponse"
        '400':
          description: The frame selector or frame-generation model is invalid for the selected workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicStoryboardImageValidationError"
  /api/accounts:
    get:
      summary: List local platform accounts and authorization capability status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Local account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalAccount"
        "401":
          description: Local agent token is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/remove:
    post:
      summary: Remove a local account registry entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRemoveRequest"
      responses:
        "200":
          description: Account entry was removed or was already absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRemoveSuccess"
        "400":
          description: Default account cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/rename:
    post:
      summary: Rename an account matrix display name without changing platform profile data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRenameRequest"
      responses:
        "200":
          description: Account display name was updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRenameSuccess"
        "400":
          description: Account id or display name is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Current user cannot rename accounts in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account was not found in the requested organization or is outside the user's scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloud-login/open-url:
    post:
      summary: Open a platform URL in the local executor browser profile for the selected account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudLoginOpenUrlRequest"
      responses:
        "200":
          description: URL was opened or reused in an interactive local browser session bound to accountId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudLoginOpenUrlResponse"
        "400":
          description: URL is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Local browser session could not start or navigate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/library/update-title:
    post:
      summary: Update a local material title edited from the native publish table
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title]
              properties:
                id: {type: string, minLength: 1}
                title: {type: string}
              additionalProperties: false
      responses:
        "200":
          description: Material title was updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, title]
                properties:
                  ok: {const: true}
                  id: {type: string, minLength: 1}
                  title: {type: string}
                additionalProperties: false
        "404":
          description: Material was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/publish/run:
    post:
      summary: Publish a local material with an optional title override from the native publish table
      description: Xiaohongshu/XHS ships enabled (MATRIX_XHS_ENABLED=1 by default). Requests that select Xiaohongshu/XHS are rejected with error=platform_disabled only when MATRIX_XHS_ENABLED=0 is set and the service is restarted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materialId]
              properties:
                materialId: {type: string, minLength: 1}
                centralMaterialId: {type: string}
                accountId: {type: string, default: douyin-self}
                platform: {type: string, enum: [douyin, xhs]}
                dryRun: {type: boolean, default: true}
                publishTitle:
                  type: string
                  description: Title override from the editable publish table; formal publishing uses at most the first 30 characters, while the saved material title may be longer. When omitted, the material title is used.
              additionalProperties: true
      responses:
        "200":
          description: Publish task completed, filled, failed, or requires manual browser action
          content:
            application/json:
              schema:
                type: object
                required: [ok, filled, published, dryRun]
                properties:
                  ok: {type: boolean}
                  filled: {type: boolean}
                  published: {type: boolean}
                  dryRun: {type: boolean}
                  error: {type: string}
                  fileCount:
                    type: integer
                    minimum: 0
                    description: Present on publish preflight failures such as douyin_single_video_required.
                  finalUrl: {type: string}
                  steps:
                    type: array
                    items: {type: string}
                  shot: {type: string}
                additionalProperties: true
        "409":
          description: Another publish run is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Xiaohongshu/XHS publishing is disabled by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/douyin/download:
    post:
      summary: Download and import a Douyin work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DouyinDownloadRequest"
      responses:
        "200":
          description: Download completed or dry-run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DouyinDownloadSuccess"
        "403":
          description: Authenticated media download was rejected twice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Douyin detail connection, download, or media validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Downloaded media could not be committed to the material library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/douyin/dm/inbox:
    post:
      summary: Read recent messages from one specified Douyin customer DM session through the local browser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DouyinDmInboxRequest"
      responses:
        "200":
          description: Recent DM messages were read or the session is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DouyinDmInboxResponse"
        "400":
          description: Target customer profile is missing or unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Douyin login is required in the local browser profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Local browser could not open or parse the DM session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/xhs/download:
    post:
      summary: Download and import a Xiaohongshu note
      deprecated: true
      description: Enabled by default (MATRIX_XHS_ENABLED=1). The local executor and central server return 404 with error=platform_disabled only when MATRIX_XHS_ENABLED=0 is set and the relevant services are restarted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XhsDownloadRequest"
      responses:
        "200":
          description: Download and material import completed while MATRIX_XHS_ENABLED=1 (the shipped default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XhsDownloadSuccess"
        "404":
          description: Xiaohongshu/XHS platform is disabled by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Downloaded media could not be committed to the material library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream download or media validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public-media/{materialId}/{fileName}:
    get:
      summary: Temporarily expose a material file through a signed HTTPS URL for remote AI providers
      parameters:
        - name: materialId
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: fileName
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - name: orgId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: expires
          in: query
          required: true
          schema: {type: integer}
        - name: token
          in: query
          required: true
          schema: {type: string, minLength: 32}
      responses:
        "200":
          description: Material bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Link is expired, unsigned, or has an invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Material or file does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account/balance:
    get:
      summary: Return the authenticated account balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Configured billing data source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/billing/ledger:
    get:
      summary: Return legacy rows or filtered billing ledger rows for the authenticated account
      description: Omitting every recognized dashboard parameter preserves the legacy reverse latest-100 ledger response. Supplying at least one recognized dashboard parameter (startDate, endDate, type, status, page, or pageSize) enables the validated, paginated dashboard response; unrelated query parameters leave the legacy response unchanged. The selected date range cannot exceed 366 calendar days.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Inclusive China Standard Time start date. Defaults to 29 days before endDate.
          schema: {type: string, format: date}
        - name: endDate
          in: query
          description: Inclusive China Standard Time end date. Defaults to the current date.
          schema: {type: string, format: date}
        - name: type
          in: query
          schema: {type: string, enum: [video, image, voice, other, recharge, refund]}
        - name: status
          in: query
          schema: {type: string, enum: [charged, refunded, recharged, failed]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, enum: [20, 50, 100], maximum: 100, default: 20}
      responses:
        "200":
          description: Legacy raw rows without recognized dashboard parameters, or strict normalized paginated rows when at least one recognized dashboard parameter is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LegacyBillingLedgerResponse"
                  - $ref: "#/components/schemas/BillingLedgerResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Query parameters are invalid or the date range exceeds 366 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal billing response validation failed (internal_billing_response_error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A configured billing data source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/billing/analytics:
    get:
      summary: Return authenticated account billing analytics
      description: Computes consumption by China Standard Time calendar date. The inclusive date range defaults to the latest 30 days and cannot exceed 366 calendar days.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Inclusive China Standard Time start date. Defaults to 29 days before endDate.
          schema: {type: string, format: date}
        - name: endDate
          in: query
          description: Inclusive China Standard Time end date. Defaults to the current date.
          schema: {type: string, format: date}
        - name: groupBy
          in: query
          schema: {type: string, enum: [day, month], default: day}
      responses:
        "200":
          description: Billing analytics for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAnalytics"
        "400":
          description: Query parameters are invalid or the date range exceeds 366 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal billing response validation failed (internal_billing_response_error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A configured billing data source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/billing/charge:
    post:
      summary: Charge the authenticated account for a local capability or an LK888 actual cost
      description: Non-model capabilities use server-owned prices. LK888 postpaid settlement sets allowArrears=true and uses the exact amount/model/task returned by LK888. Cloud-bean wallet amounts use 1 cloud bean = 1 CNY.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingChargeRequest"
      responses:
        "200":
          description: Charge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingChargeResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Balance is insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingChargeResponse"
  /api/billing/refund:
    post:
      summary: Refund a previous charge by idempotent reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRefundRequest"
      responses:
        "200":
          description: Refund completed or no refundable charge exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRefundResponse"
        "400":
          description: Refund failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRefundResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/local-browser/status:
    get:
      summary: Return paired local browser clients and recent local browser tasks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        "200":
          description: Local browser status for the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBrowserStatus"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not a member of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/local-browser/task:
    get:
      summary: Return a local browser task detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema: {type: string, minLength: 1}
        - name: taskId
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Local browser task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBrowserTask"
        "400":
          description: Missing or invalid task id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user cannot access this task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a local browser task for a paired desktop client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalBrowserTaskCreateRequest"
      responses:
        "200":
          description: Local browser task was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBrowserTask"
        "400":
          description: Unsupported local browser task type or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not a member of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/finder/discover:
    post:
      summary: Discover intent leads from enabled platform comments
      description: Xiaohongshu/XHS ships enabled (MATRIX_XHS_ENABLED=1 by default). Requests with platform=xhs/xiaohongshu/rednote are rejected with error=platform_disabled only when MATRIX_XHS_ENABLED=0 is set and the service is restarted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinderDiscoverRequest"
      responses:
        "200":
          description: Discovery completed or returned a platform-level recoverable failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinderDiscoverResponse"
        "400":
          description: Missing keyword or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not a member of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Xiaohongshu/XHS discovery is disabled by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/central/nodes:
    get:
      summary: Return online and registered central execution nodes
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: all
          in: query
          required: false
          schema: {type: string, enum: ["1", "true", "yes"]}
      responses:
        "200":
          description: Central node status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentralNodes"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not an auditor of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/usage:
    get:
      summary: Return enterprise usage metrics, quota usage, and real seven-day task trend
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Enterprise usage metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseUsage"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not an auditor of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/task-center:
    get:
      summary: Return enterprise task center summary and latest central, queue, and local-client tasks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 12}
      responses:
        "200":
          description: Enterprise task center payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseTaskCenter"
        "401":
          description: Session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not an auditor of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/invites/create:
    post:
      summary: Create an enterprise invite code without requiring phone or email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseInviteCreateRequest"
      responses:
        "200":
          description: Invite code was created and returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseInviteCreateResponse"
        "403":
          description: The authenticated user cannot create invites for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/users/upsert:
    post:
      summary: Add or update an enterprise member without requiring phone or email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseUserUpsertRequest"
      responses:
        "200":
          description: Enterprise member was added or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseUserUpsertResponse"
        "400":
          description: Required member name is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user cannot add members to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/invites/verify:
    post:
      summary: Verify an enterprise invite code without exposing the secret in URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseInviteVerifyRequest"
      responses:
        "200":
          description: Invite is valid and organization metadata is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseInviteVerifyResponse"
        "410":
          description: Invite is expired, revoked, accepted, or organization is inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/enterprise/invites/accept:
    post:
      summary: Accept an enterprise invite code with name and password only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseInviteAcceptRequest"
      responses:
        "200":
          description: User joined the invited organization and received a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseInviteAcceptResponse"
        "400":
          description: Invite code, display name, or password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing invited identifier requires current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lk888/v1beta/models/{model}:generateContent:
    post:
      summary: Proxy a Gemini native generateContent request
      security:
        - bearerAuth: []
      parameters:
        - name: model
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiAudioRequest"
      responses:
        "200":
          description: Upstream Gemini response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Center session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: LK888 is not configured on the center server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ComicStoryboardImageGenerateRequest:
      type: object
      properties:
        workflow_mode: {type: string, enum: [action_flow, keyframes, multiframe]}
        workflowMode: {type: string, enum: [action_flow, keyframes, multiframe]}
        quantity: {type: integer, minimum: 1}
        count: {type: integer, minimum: 1}
        prompt: {type: string}
        model: {type: string}
        frameIndex: {type: integer, enum: [1, 2]}
        frame_index: {type: integer, enum: [1, 2]}
      additionalProperties: true
    ComicStoryboardImageGenerateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [task_id]
          properties:
            task_id: {type: string}
            task_ids:
              type: array
              minItems: 1
              items: {type: string}
          additionalProperties: true
      additionalProperties: true
    ComicStoryboardImageValidationError:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
      additionalProperties: false
    AccountBalance:
      type: object
      required: [ok, userId, balance]
      properties:
        ok: {const: true}
        userId: {type: string}
        phone: {type: string}
        balance:
          oneOf:
            - {type: number}
            - {const: inf}
      additionalProperties: true
    LegacyBillingLedgerResponse:
      type: object
      required: [ok, balance, ledger]
      properties:
        ok: {const: true}
        ledger:
          type: array
          description: Historical raw ledger objects preserved for legacy clients.
          items: {}
        balance:
          oneOf:
            - {type: number}
            - {const: inf}
      additionalProperties: true
      not:
        required: [pagination]
    BillingLedgerResponse:
      type: object
      required: [ok, balance, ledger, pagination]
      additionalProperties: false
      properties:
        ok: {const: true}
        balance:
          oneOf:
            - {type: number}
            - {const: inf}
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/BillingLedgerRow"
        pagination:
          $ref: "#/components/schemas/BillingPagination"
    BillingAnalytics:
      type: object
      required: [ok, period, metrics, trend, distribution]
      additionalProperties: false
      properties:
        ok: {const: true}
        period:
          type: object
          required: [startDate, endDate, groupBy, timezone]
          additionalProperties: false
          properties:
            startDate: {type: string, format: date}
            endDate: {type: string, format: date}
            groupBy: {type: string, enum: [day, month]}
            timezone: {const: Asia/Shanghai}
        metrics:
          $ref: "#/components/schemas/BillingMetricSet"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/BillingTrendBucket"
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/BillingDistributionItem"
    BillingMetricSet:
      type: object
      required: [balance, totalConsumption, activeConsumptionDays, dailyAverage, videoTaskCount, videoAverage]
      additionalProperties: false
      properties:
        balance:
          oneOf:
            - {type: number}
            - {const: inf}
        totalConsumption: {type: number}
        activeConsumptionDays: {type: integer, minimum: 0}
        dailyAverage: {type: number}
        videoTaskCount: {type: integer, minimum: 0}
        videoAverage: {type: number}
    BillingTrendBucket:
      type: object
      required: [bucket, amount]
      additionalProperties: false
      properties:
        bucket: {type: string}
        amount: {type: number}
    BillingDistributionItem:
      type: object
      required: [type, label, amount, ratio]
      additionalProperties: false
      properties:
        type: {type: string, enum: [video, image, voice, other]}
        label: {type: string}
        amount: {type: number}
        ratio: {type: number}
    BillingLedgerRow:
      type: object
      required: [id, createdAt, timestamp, type, typeLabel, modelId, taskId, requestId, detail, change, balanceAfter, status, statusLabel]
      additionalProperties: false
      properties:
        id: {type: string}
        createdAt: {type: string, format: date-time}
        timestamp: {type: number}
        type: {type: string, enum: [video, image, voice, other, recharge, refund]}
        typeLabel: {type: string}
        modelId: {type: string}
        taskId: {type: string}
        requestId: {type: string}
        detail: {type: string}
        change: {type: number}
        balanceAfter: {type: [number, 'null']}
        status: {type: string, enum: [charged, refunded, recharged, failed]}
        statusLabel: {type: string}
    BillingPagination:
      type: object
      required: [page, pageSize, total, totalPages]
      additionalProperties: false
      properties:
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, enum: [20, 50, 100], maximum: 100}
        total: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    BillingChargeRequest:
      type: object
      properties:
        capability: {type: string}
        amount: {type: number, minimum: 0}
        reason: {type: string}
        ref: {type: string}
        allowArrears:
          type: boolean
          default: false
          description: True only for postpaid LK888 actual-cost settlement; the charge may make the balance negative.
        meta:
          type: object
          additionalProperties: false
          properties:
            modelId: {type: string}
            taskId: {type: string}
            actualAmount: {type: number, minimum: 0}
            billingScenario: {type: string}
            billingStage: {type: string}
            billingDetail: {type: string}
      additionalProperties: false
    BillingChargeResponse:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        balance: {type: number}
        error: {type: string}
      additionalProperties: true
    BillingRefundRequest:
      type: object
      required: [ref]
      properties:
        ref: {type: string, minLength: 1}
      additionalProperties: false
    BillingRefundResponse:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        balance: {type: number}
        refunded: {type: number}
        error: {type: string}
      additionalProperties: true
    LocalBrowserStatus:
      type: object
      required: [ok, orgId, online, clients, tasks]
      properties:
        ok: {const: true}
        orgId: {type: string}
        online: {type: boolean}
        staleSec: {type: number}
        clients:
          type: array
          items:
            type: object
            additionalProperties: true
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    LocalBrowserTaskCreateRequest:
      type: object
      required: [orgId]
      properties:
        orgId: {type: string, minLength: 1}
        type:
          type: string
          default: xhs.discover
          description: Supported task types include douyin.comment.publish. Its local result may return ok=false, skipped=true, a machine error such as douyin_daily_comment_limit/douyin_comment_cooldown/douyin_comment_risk_cooldown, status, cooldownLeft, safety, and Chinese message/userMessage when the local Douyin comment hard gate blocks before browser or platform calls.
        payload:
          type: object
          additionalProperties: true
        clientId: {type: string}
        allowOffline: {type: boolean}
      additionalProperties: true
    LocalBrowserTask:
      type: object
      required: [ok]
      properties:
        ok: {const: true}
        id: {type: string}
        taskId: {type: string}
        orgId: {type: string}
        status: {type: string}
        type: {type: string}
        result:
          type: object
          additionalProperties: true
        error: {type: string}
        errorId: {type: string, pattern: "^err-[A-Za-z0-9_-]+$"}
        task:
          type: object
          additionalProperties: true
      additionalProperties: true
    FinderDiscoverRequest:
      type: object
      required: [keyword]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 120}
        product: {type: string, maxLength: 120}
        platform: {type: string, enum: [douyin, xhs, xiaohongshu, rednote, 小红书], default: douyin}
        videoNum: {type: integer, minimum: 1, maximum: 20, default: 5}
        num: {type: integer, minimum: 1, maximum: 20}
        commentMode: {type: string, enum: [page, all], default: page}
        accountId: {type: string}
        guestMode: {type: boolean, default: false}
        accountCollectionConfirmed: {type: boolean, default: false}
      additionalProperties: true
    FinderLead:
      type: object
      properties:
        id: {type: string}
        user: {type: string}
        u: {type: string}
        text: {type: string}
        c: {type: string}
        intent: {type: string}
        score: {type: number}
        profileUrl: {type: string}
        userUrl: {type: string}
        sourceVideoUrl: {type: string}
        sourceVideoTitle: {type: string}
        noteId: {type: string}
        awemeId: {type: string}
        diggCount: {type: integer}
        platform: {type: string}
      additionalProperties: true
    FinderDiscoverResponse:
      type: object
      required: [ok, platform, keyword, videoCount, commentCount, leadCount]
      properties:
        ok: {type: boolean}
        platform: {type: string}
        keyword: {type: string}
        accountId: {type: string}
        videos:
          type: array
          items:
            type: object
            additionalProperties: true
        videoCount: {type: integer, minimum: 0}
        comments:
          type: array
          items:
            $ref: "#/components/schemas/FinderLead"
        commentCount: {type: integer, minimum: 0}
        leads:
          type: array
          items:
            $ref: "#/components/schemas/FinderLead"
        leadCount: {type: integer, minimum: 0}
        blocked: {type: boolean}
        needLogin: {type: boolean}
        riskCode: {type: string, enum: ["", "300012", "300031"]}
        error: {type: string, enum: ["", "xhs_ip_risk", "xhs_login_required", "xhs_search_failed", "xhs_comment_collection_failed"]}
        errorId: {type: string, pattern: "^err-[A-Za-z0-9_-]+$"}
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        leadSync:
          type: object
          additionalProperties: true
      additionalProperties: true
    CentralNodes:
      type: object
      required: [ok, nodes, allNodes]
      properties:
        ok: {const: true}
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        allNodes:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    EnterpriseTaskTrendBucket:
      type: object
      required: [date, label, count]
      additionalProperties: false
      properties:
        date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
        label: {type: string}
        count: {type: integer, minimum: 0}
    EnterpriseUsage:
      type: object
      required: [ok, orgId, tasks24h, tasks7d, taskTrend7d]
      properties:
        ok: {const: true}
        orgId: {type: string}
        generatedAt: {type: number}
        window24hSec: {type: integer}
        tasks24h: {type: integer, minimum: 0}
        tasks7d: {type: integer, minimum: 0}
        taskTrend7d:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/EnterpriseTaskTrendBucket"
        billableTasks24h: {type: integer, minimum: 0}
        billableTasks7d: {type: integer, minimum: 0}
        status24h: {type: object, additionalProperties: {type: integer}}
        status7d: {type: object, additionalProperties: {type: integer}}
        type24h: {type: object, additionalProperties: {type: integer}}
        type7d: {type: object, additionalProperties: {type: integer}}
        queueCount: {type: integer, minimum: 0}
        accounts: {type: integer, minimum: 0}
        usableAccounts: {type: integer, minimum: 0}
        nodes:
          type: integer
          minimum: 0
          description: Registered execution endpoints in the enterprise usage scope, including local browser clients and legacy nodes.
        onlineNodes:
          type: integer
          minimum: 0
          description: Online execution endpoints with fresh heartbeat in the enterprise usage scope, including local browser clients and legacy nodes.
        materials: {type: integer, minimum: 0}
        successRate24h: {type: number}
        failureRate24h: {type: number}
        nodeOnlineRate: {type: number}
        accountReadyRate: {type: number}
        avgDurationSec7d: {type: number}
        slaScore: {type: number}
        quota: {type: object, additionalProperties: true}
        quotaUsage: {type: object, additionalProperties: true}
        taskRecovery: {type: object, additionalProperties: true}
      additionalProperties: true
    EnterpriseTaskCenter:
      type: object
      required: [ok]
      properties:
        ok: {const: true}
        orgId: {type: string}
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
        queue:
          type: array
          items:
            type: object
            additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        statusCounts:
          type: object
          additionalProperties:
            type: integer
        typeCounts:
          type: object
          additionalProperties:
            type: integer
        failureGroups:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    LegalConsent:
      type: object
      required: [accepted, termsVersion, privacyVersion, acceptedAt, clientVersion]
      additionalProperties: false
      properties:
        accepted: {const: true}
        termsVersion: {type: string, minLength: 1, maxLength: 40}
        privacyVersion: {type: string, minLength: 1, maxLength: 40}
        acceptedAt: {type: string, format: date-time}
        clientVersion: {type: string, minLength: 1, maxLength: 40}
    AuthLoginRequest:
      type: object
      required: [identifier, password, legalConsent]
      additionalProperties: false
      properties:
        identifier: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 256}
        code: {type: string, maxLength: 6}
        legalConsent: {$ref: "#/components/schemas/LegalConsent"}
    AuthRegisterRequest:
      type: object
      required: [phone, password, code, legalConsent]
      additionalProperties: false
      properties:
        phone: {type: string, pattern: "^[0-9]{11}$"}
        password: {type: string, minLength: 6, maxLength: 256}
        code: {type: string, minLength: 1, maxLength: 6}
        name: {type: string, maxLength: 40}
        legalConsent: {$ref: "#/components/schemas/LegalConsent"}
    AuthSuccess:
      type: object
      required: [ok, token, user, organizations, appRole, roleScope]
      properties:
        ok: {const: true}
        token: {type: string}
        expiresAt: {type: number}
        user: {type: object, additionalProperties: true}
        organizations:
          type: array
          items: {type: object, additionalProperties: true}
        appRole:
          type: string
          enum: [platform_admin, enterprise_admin, normal_user]
        productRole:
          type: string
          enum: [platform_admin, enterprise_admin, normal_user]
        roleScope:
          type: string
          enum: [all, org, self]
        balance: {type: number}
      additionalProperties: true
    AuthChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 256}
        newPassword: {type: string, minLength: 8, maxLength: 256}
    AuthChangePasswordResponse:
      type: object
      required: [ok, user, revokedSessions, changedAt]
      additionalProperties: true
      properties:
        ok: {const: true}
        user: {type: object, additionalProperties: true}
        revokedSessions: {type: integer, minimum: 0}
        changedAt: {type: number}
    EnterpriseInvite:
      type: object
      required: [id, orgId, role, status, expiresAt]
      properties:
        id: {type: string, minLength: 1}
        orgId: {type: string, minLength: 1}
        role: {type: string, enum: [owner, admin, member, auditor]}
        status: {type: string}
        recipientName: {type: string}
        recipientPhone: {type: string, description: Legacy optional field; new native invite flow leaves it empty.}
        recipientEmail: {type: string, description: Legacy optional field; new native invite flow leaves it empty.}
        expiresAt: {type: number}
        createdAt: {type: number}
        updatedAt: {type: number}
      additionalProperties: true
    EnterpriseInviteCreateRequest:
      type: object
      required: [orgId]
      properties:
        orgId: {type: string, minLength: 1}
        recipientName: {type: string, maxLength: 80}
        role: {type: string, enum: [admin, member], default: member}
        ttlHours: {type: integer, minimum: 1, maximum: 720, default: 168}
      additionalProperties: false
    EnterpriseInviteCreateResponse:
      type: object
      required: [ok, orgId, inviteCode, invite]
      properties:
        ok: {const: true}
        orgId: {type: string}
        inviteCode: {type: string, pattern: "^[0-9a-f]{64}$"}
        invite: {$ref: "#/components/schemas/EnterpriseInvite"}
        message: {const: invite_created}
      additionalProperties: false
    EnterpriseUserUpsertRequest:
      type: object
      required: [orgId, name]
      properties:
        orgId: {type: string, minLength: 1}
        id: {type: string, minLength: 1, description: Optional existing user id to update.}
        userId: {type: string, minLength: 1, description: Optional existing user id alias.}
        name: {type: string, minLength: 1, maxLength: 80}
        password: {type: string, minLength: 0, maxLength: 256, description: Optional initial password; blank means use reset-password later.}
        role: {type: string, enum: [admin, member], default: member}
        status: {type: string, enum: [active, inactive], default: active}
        phone: {type: string, description: Legacy optional field; native add-member flow leaves it empty.}
        email: {type: string, description: Legacy optional field; native add-member flow leaves it empty.}
      additionalProperties: false
    EnterpriseUserUpsertResponse:
      type: object
      required: [ok, orgId, user, credential]
      properties:
        ok: {const: true}
        orgId: {type: string}
        user: {type: object, additionalProperties: true}
        credential:
          type: object
          required: [identifier, initialPassword, generated]
          properties:
            identifier: {type: string, description: Login identifier, usually the generated user id when no phone/email is provided.}
            initialPassword: {type: string, description: Echoes the optional initial password; blank means reset-password is required before handoff.}
            generated: {type: boolean}
          additionalProperties: false
      additionalProperties: false
    EnterpriseInviteVerifyRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, pattern: "^[0-9a-f]{64}$"}
      additionalProperties: false
    EnterpriseInviteVerifyResponse:
      type: object
      required: [ok, invite, organization]
      properties:
        ok: {const: true}
        invite: {$ref: "#/components/schemas/EnterpriseInvite"}
        organization:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
            plan: {type: string}
          additionalProperties: true
      additionalProperties: false
    EnterpriseInviteAcceptRequest:
      type: object
      required: [token, name, password]
      properties:
        token: {type: string, pattern: "^[0-9a-f]{64}$"}
        name: {type: string, minLength: 1, maxLength: 80}
        password: {type: string, minLength: 8, maxLength: 256}
        currentPassword: {type: string, description: Required only when accepting a legacy invite tied to an existing phone/email user.}
      additionalProperties: false
    EnterpriseInviteAcceptResponse:
      allOf:
        - $ref: "#/components/schemas/AuthSuccess"
        - type: object
          required: [ok, token, user, membership, memberships, organizations, orgId, appRole, roleScope]
          properties:
            ok: {const: true}
            token: {type: string}
            expiresAt: {type: number}
            user: {type: object, additionalProperties: true}
            membership: {type: object, additionalProperties: true}
            memberships:
              type: array
              items: {type: object, additionalProperties: true}
            organizations:
              type: array
              items: {type: object, additionalProperties: true}
            orgId: {type: string}
            appRole:
              type: string
              enum: [platform_admin, enterprise_admin, normal_user]
            productRole:
              type: string
              enum: [platform_admin, enterprise_admin, normal_user]
            roleScope:
              type: string
              enum: [all, org, self]
            balance: {type: number}
            message: {const: invite_accepted}
          additionalProperties: true
    LocalAccount:
      type: object
      required: [id, platform, cookieReady, usable]
      properties:
        id: {type: string, minLength: 1}
        platform: {type: string, enum: [douyin, xhs]}
        name: {type: string}
        handle: {type: string}
        avatar: {type: string}
        profileDir: {type: string}
        cookieReady: {type: boolean}
        cookieCount: {type: integer, minimum: 0}
        usable: {type: boolean}
        online: {type: boolean}
        status: {type: string}
        needLogin: {type: boolean}
        fans:
          oneOf:
            - {type: string}
            - {type: integer, minimum: 0}
        followers:
          oneOf:
            - {type: string}
            - {type: integer, minimum: 0}
          description: Last known follower count copied from account profile metadata when available.
        todayPublish:
          type: integer
          minimum: 0
          description: Successful publish count for this account on the current central-server day.
        publishedToday:
          type: integer
          minimum: 0
          description: Alias of todayPublish for native-client compatibility.
        todayPublishDay: {type: string}
        todayPublishUpdatedAt: {type: number}
        capabilities:
          type: object
          additionalProperties: true
      additionalProperties: true
    AccountRemoveRequest:
      type: object
      required: [id]
      properties:
        id: {type: string, minLength: 1}
        deleteFiles: {type: boolean, default: false}
      additionalProperties: false
    AccountRemoveSuccess:
      type: object
      required: [ok, removed, id]
      properties:
        ok: {const: true}
        removed: {type: integer, minimum: 0}
        id: {type: string}
      additionalProperties: false
    AccountRenameRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          description: Local account id or central account id such as node:xhs-self.
        name:
          type: string
          minLength: 1
          maxLength: 40
        nickname:
          type: string
          maxLength: 40
          description: Compatibility alias for name.
        displayName:
          type: string
          maxLength: 40
          description: Compatibility alias for name.
      additionalProperties: false
    AccountRenameSuccess:
      type: object
      required: [ok, id, name, updated]
      properties:
        ok: {const: true}
        id: {type: string}
        name: {type: string}
        updated:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: boolean}
        account:
          $ref: "#/components/schemas/LocalAccount"
      additionalProperties: true
    CloudLoginOpenUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https?://"
          description: Platform profile, work, or login URL to open in the local executor browser.
        accountId:
          type: string
          default: douyin-self
          description: Account matrix ID whose local browser profile should be used.
        account:
          type: string
          description: Compatibility alias for accountId.
        platform:
          type: string
          enum: [douyin, xhs]
          description: Optional caller hint; accountId remains the authoritative profile selector.
      additionalProperties: false
    CloudLoginOpenUrlResponse:
      type: object
      required: [ok, hasSession, sessionId, accountId, requestedUrl]
      properties:
        ok: {type: boolean}
        hasSession: {type: boolean}
        sessionId: {type: string}
        accountId:
          type: string
          description: Local account ID whose interactive browser session handled this URL.
        requestedUrl: {type: string, format: uri}
        url:
          type: string
          description: Browser's current URL after navigation.
        loggedIn: {type: boolean}
        createdSession: {type: boolean}
        message: {type: string}
        warning: {type: string}
        error: {type: string}
        profileDir:
          type: string
          description: Local profile directory path. Callers must not expose cookies from it.
      additionalProperties: true
    LegalConsentError:
      type: object
      required: [ok, error, requiredTermsVersion, requiredPrivacyVersion, effectiveDate]
      properties:
        ok: {const: false}
        error: {type: string, enum: [legal_consent_required, legal_consent_outdated]}
        requiredTermsVersion: {type: string}
        requiredPrivacyVersion: {type: string}
        effectiveDate: {type: string, format: date}
      additionalProperties: false
    DouyinDownloadRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: "^https?://([^/]+\\.)?douyin\\.com/"
        save_choice:
          type: string
          default: all
        dryRun:
          type: boolean
          default: false
    DouyinDmInboxRequest:
      type: object
      anyOf:
        - required: [target]
        - required: [userUrl]
        - required: [secUid]
      properties:
        target:
          type: string
          minLength: 1
          description: Douyin customer profile URL or sec_uid. Numeric uid is rejected because the browser DM entry is not stable for it.
        userUrl:
          type: string
          description: Compatibility alias for target.
        secUid:
          type: string
          description: Compatibility alias for target when the caller stores Douyin sec_uid separately.
        accountId:
          type: string
          description: Optional Account matrix ID whose local Douyin login profile and Cookie cache are used. When omitted, the latest usable Douyin account is selected.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        sinceFingerprint:
          type: string
          description: Last processed message fingerprint. When present, the response returns only messages after it if the marker is visible.
      additionalProperties: false
    DouyinDmInboxMessage:
      type: object
      required: [id, fingerprint, direction, kind, text, createdAtText]
      properties:
        id: {type: string}
        fingerprint:
          type: string
          description: Stable, non-reversible message fingerprint for duplicate detection and audit correlation.
        direction:
          type: string
          enum: [customer, me, unknown]
        kind:
          type: string
          enum: [text, image, voice, video, card, emoji, unknown]
        text:
          type: string
          maxLength: 1000
          description: Present only in the local-engine response for text messages. Non-text messages return an empty string; center task persistence redacts this field and stores only textFingerprint.
        createdAtText: {type: string}
      additionalProperties: true
    DouyinDmInboxResponse:
      type: object
      required: [ok, messages, nonTextCount]
      properties:
        ok: {type: boolean}
        platform: {type: string, enum: [douyin]}
        target:
          type: string
          description: Local-engine response only. Center task persistence stores targetFingerprint instead of the raw target.
        accountId:
          type: string
          description: Account matrix ID whose local Douyin login state was used for this poll.
        dmCookieInjection:
          type: object
          description: Safe local diagnostics containing Cookie counts only; Cookie names and values are never returned.
          required: [attemptedCount, addedCount]
          properties:
            attemptedCount: {type: integer, minimum: 0}
            addedCount: {type: integer, minimum: 0}
            error:
              type: string
              description: Exception type only when browser Cookie injection fails.
          additionalProperties: false
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DouyinDmInboxMessage"
        nonTextCount:
          type: integer
          minimum: 0
        sinceFingerprint: {type: string}
        limit:
          type: integer
          minimum: 1
          maximum: 20
        needLogin: {type: boolean}
        empty: {type: boolean}
        error:
          type: string
          enum: ["", "missing_target", "numeric_uid_unsupported_in_browser_dm", "not_authenticated", "dm_inbox_button_not_found", "dm_inbox_child_failed", "dm_inbox_child_exception", "dm_inbox_invalid_result"]
      additionalProperties: true
    XhsDownloadRequest:
      type: object
      description: Accepted while MATRIX_XHS_ENABLED=1, which is the shipped default.
      anyOf:
        - required: [url]
        - required: [noteUrl]
      properties:
        url: {type: string, format: uri}
        noteUrl: {type: string, format: uri}
        accountId: {type: string}
        guestMode: {type: boolean, default: false}
        accountCollectionConfirmed: {type: boolean, default: false}
      additionalProperties: false
    DownloadFile:
      type: object
      required: [path]
      properties:
        path: {type: string}
        kind: {type: string, enum: [video, image, file]}
      additionalProperties: true
    Material:
      type: object
      required: [id]
      properties:
        id: {type: string}
        repaired: {type: boolean}
        repairedAt: {type: number}
        duration: {type: number, minimum: 0}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        urls:
          type: array
          items: {type: string}
        publicUrls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: true
    DouyinDownloadSuccess:
      type: object
      required: [ok]
      properties:
        ok: {const: true}
        dryRun: {type: boolean}
        savePath: {type: string}
        files:
          type: array
          items: {$ref: "#/components/schemas/DownloadFile"}
        materialId: {type: string}
        material: {$ref: "#/components/schemas/Material"}
      additionalProperties: true
    XhsDownloadSuccess:
      type: object
      description: Response emitted while MATRIX_XHS_ENABLED=1, which is the shipped default.
      required: [ok, materialId, material]
      properties:
        ok: {const: true}
        savePath: {type: string}
        note:
          type: object
          properties:
            title: {type: string}
            body: {type: string}
            tags:
              type: array
              items: {type: string}
          additionalProperties: true
        title: {type: string}
        body: {type: string}
        tags:
          type: array
          items: {type: string}
        files:
          type: array
          items: {$ref: "#/components/schemas/DownloadFile"}
        materialId: {type: string, minLength: 1}
        material: {$ref: "#/components/schemas/Material"}
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error:
          type: string
          description: Stable machine-readable code; Xiaohongshu/XHS-disabled routes use platform_disabled.
        stage: {type: string}
        errorId: {type: string, pattern: "^err-[A-Za-z0-9_-]+$"}
        context:
          type: object
          additionalProperties: true
      additionalProperties: true
    MiniMaxVideoGenerateRequest:
      type: object
      required: [prompt, duration, resolution]
      properties:
        model:
          type: string
          description: Optional client label. The center ignores this value and always submits provider model MiniMax-H3.
        prompt:
          type: string
          minLength: 1
        duration:
          type: integer
          minimum: 4
          maximum: 15
        resolution:
          type: string
          enum: [768P, 2K]
        content:
          type: array
          items:
            oneOf:
              - type: object
                required: [type, text]
                properties:
                  type:
                    type: string
                    enum: [text]
                  text:
                    type: string
                    minLength: 1
                additionalProperties: true
              - type: object
                required: [type, image_url]
                properties:
                  type:
                    type: string
                    enum: [image_url]
                  image_url:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                        pattern: "^https://"
                    additionalProperties: true
                additionalProperties: true
              - type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    pattern: "^https://"
                additionalProperties: true
              - type: object
                additionalProperties: true
      additionalProperties: false
    MiniMaxVideoTaskResponse:
      type: object
      required:
        - ok
        - businessTaskId
        - providerTaskId
        - requestedModel
        - actualModel
        - mode
        - duration
        - resolution
        - billingRef
        - status
      properties:
        ok: {const: true}
        businessTaskId: {type: string, minLength: 1}
        providerTaskId: {type: string}
        requestedModel: {type: string, minLength: 1}
        actualModel: {type: string, minLength: 1}
        mode:
          type: string
          const: video_generation
        duration:
          type: integer
          minimum: 4
          maximum: 15
        resolution:
          type: string
          enum: [768P, 2K]
        billingRef: {type: string}
        status:
          type: string
          enum: [submitting, pending, processing, failed, cancelled, awaiting_actual_cost]
        traceId: {type: string, minLength: 1}
        failureStage: {type: string}
        error: {type: string}
        resultUrl:
          type: string
          format: uri
          pattern: "^https://"
        providerResultUrl:
          type: string
          format: uri
          pattern: "^https://"
        createdAt: {type: number}
        updatedAt: {type: number}
      additionalProperties: true
    GeminiAudioRequest:
      type: object
      required: [contents]
      properties:
        contents:
          type: array
          minItems: 1
          items:
            type: object
            required: [parts]
            properties:
              role: {type: string}
              parts:
                type: array
                minItems: 1
                items:
                  oneOf:
                    - type: object
                      required: [text]
                      properties:
                        text: {type: string}
                      additionalProperties: false
                    - type: object
                      required: [inline_data]
                      properties:
                        inline_data:
                          type: object
                          required: [mime_type, data]
                          properties:
                            mime_type: {const: audio/mpeg}
                            data: {type: string, contentEncoding: base64}
                          additionalProperties: false
                      additionalProperties: false
            additionalProperties: false
        generationConfig:
          type: object
          additionalProperties: true
      additionalProperties: false
